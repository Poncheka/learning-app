# Publishes itspliny.com: the docs folder, plus a page for every shared story, so a story link
# shows its title and artwork in a text thread. Runs on every push to docs, and every 10 minutes
# so newly shared stories get their page. Needs Settings > Pages > Source set to "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/build-share-pages.mjs", ".github/workflows/site.yml"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Copy the site and write the story pages
        run: |
          cp -r docs _site
          node scripts/build-share-pages.mjs _site
          ls -R _site | head -40
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
